<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Meta Information -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS -->
  <link href="./output.css" rel="stylesheet">

  <title>Login Page</title>
</head>

<body class="bg-amber-50 min-h-screen flex items-center justify-center">

  <!-- Main Container -->
  <div class="bg-white shadow-lg rounded-lg flex max-w-4xl w-full">

    <!-- ================= LEFT SECTION : LOGIN FORM ================= -->
    <div class="w-1/2 p-8">

      <!-- Logo -->
      <div class="flex items-center gap-2 mb-6">
        <img class="w-8 h-8"
          src="https://img.icons8.com/?size=100&id=UdJR7zKxfzUy&format=png&color=000000"
          alt="Logo">

        <h2 class="font-bold text-lg">
          FactStudy Forever
        </h2>
      </div>

      <!-- Heading -->
      <h1 class="text-2xl font-bold">Welcome Back</h1>
      <p class="text-gray-500 mb-6">
        Please enter your details
      </p>

      <!-- Login Form -->
      <form class="flex flex-col gap-4">

        <!-- Email -->
        <div>
          <label class="text-sm">Email Address</label>
          <input
            type="email"
            placeholder="Enter Email"
            class="w-full border rounded-md p-2 mt-1">
        </div>

        <!-- Password -->
        <div>
          <label class="text-sm">Password</label>
          <input
            type="password"
            placeholder="Enter Password"
            class="w-full border rounded-md p-2 mt-1">
        </div>

        <!-- Remember + Forgot -->
        <div class="flex items-center justify-between text-sm">

          <label class="flex items-center gap-2">
            <input type="checkbox">
            Remember for 30 days
          </label>

          <a href="#" class="text-blue-500 hover:underline">
            Forgot password
          </a>

        </div>

        <!-- Sign In Button -->
        <button
          class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600">
          Sign In
        </button>

      </form>

      <!-- Google Login -->
      <div class="flex items-center justify-center gap-2 border rounded-md p-2 mt-4 cursor-pointer">

        <img class="w-5 h-5"
          src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000"
          alt="Google">

        <p>Sign in with Google</p>

      </div>

      <!-- Footer -->
      <p class="text-sm text-center mt-6">
        Don't have an account?
        <span class="text-blue-500 cursor-pointer">
          Sign up
        </span>
      </p>

    </div>


    <!-- ================= RIGHT SECTION : IMAGE ================= -->
    <div class="w-1/2">

      <img
        class="w-full h-full object-cover rounded-r-lg"
        src="https://plus.unsplash.com/premium_vector-1682269971961-a023bbdf6e76?q=80&w=1160&auto=format&fit=crop"
        alt="Login Image">

    </div>

  </div>

</body>

</html>
